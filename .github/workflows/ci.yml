name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Gate de eval da IA
        run: npm run eval:mock

      - name: Auditoria de dependências (gate critical)
        run: npm audit --audit-level=critical

      - name: Auditoria de dependências (relatório high)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      - name: Dashboard
        working-directory: dashboard
        run: |
          npm ci
          npm run build

  image:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem
        run: docker build -t autocorrecoes:ci .
      - name: Varredura da imagem (relatório)
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: autocorrecoes:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"
