name: AI quality gate

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Avaliação com DeepSeek real
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AI_BUDGET_USD: "1"
          EVAL_MIN_PRECISION: "0.7"
          EVAL_MIN_RECALL: "0.7"
        run: npm run eval
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: eval/last-report.json
